    <script type="application/ld+json">

      "@context": "https://schema.org",

        { "@type": "Offer", "name": "חינם", "price": "0", "priceCurrency": "ILS", "description": "2 חוברות חינם" },
        { "@type": "Offer", "name": "הורה", "price": "19", "priceCurrency": "ILS", "description": "5 חוברות בחודש" },
        { "@type": "Offer", "name": "מורה פרטית", "price": "59", "priceCurrency": "ILS", "description": "20 חוברות בחודש" }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "למה לא פשוט להשתמש ב-ChatGPT, Gemini או Claude?",
          "acceptedAnswer": { "@type": "Answer", "text": "ChatGPT נותן טקסט גולמי שצריך לעצב, לפרמט ולחזור עליו עם פרומפטים — כ-20-40 דקות לחוברת. בשבילי בנויה על אותה AI אבל הכל מוגדר מראש: עיצוב מגזין שבו הילד גיבור הסיפור, התאמה לכיתות ולתכנית הלימודים הישראלית, ארכיון בענן — ותוך 60 שניות החוברת מוכנה להדפסה." }
        },
        {
          "@type": "Question",
          "name": "כמה זמן לוקח ליצור חוברת?",
          "acceptedAnswer": { "@type": "Answer", "text": "בממוצע 45-90 שניות מרגע שלחצת 'צור חוברת'. מילוי הטופס לוקח עוד 30 שניות — תוך פחות מ-2 דקות יש לך חוברת מוכנה להדפסה." }
        },
        {
          "@type": "Question",
          "name": "האם צריך ידע טכני או לדעת לכתוב פרומפטים?",
          "acceptedAnswer": { "@type": "Answer", "text": "בכלל לא. בשבילי עובדת עם 3 שדות פשוטים: שם התלמיד, כיתה, ומה תרצי לתרגל. יש גם נושאים מוכנים שאפשר ללחוץ עליהם — הטופס מתמלא אוטומטית." }
        },
        {
          "@type": "Question",
          "name": "האם החוברת מותאמת לתכנית הלימודים הישראלית?",
          "acceptedAnswer": { "@type": "Answer", "text": "כן. בשבילי יודעת מה לומדים בכל כיתה — חיבור וחיסור בכיתה ב', הכפלה בכיתה ג', שברים בכיתה ד'. אפשר גם לציין רמה ולהתאים לצרכים מיוחדים כמו ADHD, דיסלקציה או מחוננות." }
        },
        {
          "@type": "Question",
          "name": "אפשר לערוך את החוברת אחרי שנוצרה?",
          "acceptedAnswer": { "@type": "Answer", "text": "כרגע לא — אבל אפשר ליצור גרסה חדשה עם הנחיות מעודכנות. אם יש תוספת שרצית — פשוט ציינו אותה בשדה 'הנחיות חופשיות'." }
        },
        {
          "@type": "Question",
          "name": "האם הנתונים של התלמידים שלי מוגנים?",
          "acceptedAnswer": { "@type": "Answer", "text": "לחלוטין. בשבילי שומרת רק את מה שאת מזינה (שם, כיתה, נושא), עובדת עם Supabase שמצפין את כל הנתונים ועומד בתקנות GDPR, ולא מוכרת נתונים לאף גורם." }
        },
        {
          "@type": "Question",
          "name": "מה קורה אחרי 2 החוברות החינמיות?",
          "acceptedAnswer": { "@type": "Answer", "text": "האפליקציה תציג הצעה לשדרג — בלי חיוב אוטומטי ובלי כרטיס אשראי. תוכנית מורה עולה ₪59/חודש (20 חוברות) ותוכנית הורה ₪19/חודש (5 חוברות). ביטול בכל עת דרך WhatsApp." }
        }
      ]
    }
